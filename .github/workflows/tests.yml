name: Tests, Windows preview and license evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Core tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . -c requirements-runtime.lock
      - name: Unit + integration + offline suite
        run: python -m unittest discover -s tests -v
      - name: Smoke without GUI
        run: python -m localquote --smoke --db localquote-ci-temp.sqlite3

  windows-preview:
    name: Windows EXE + SBOM audit (not a release)
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact Windows runtime wheels and generate transient hash lock
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/license-evidence/wheelhouse | Out-Null
          python -m pip download --only-binary=:all: --dest docs/license-evidence/wheelhouse -r requirements-runtime.lock
          if ($LASTEXITCODE -ne 0) { throw 'Wheel download failed' }
          python packaging/wheel_provenance.py --wheelhouse docs/license-evidence/wheelhouse --lock requirements-runtime.lock --out docs/license-evidence/runtime-hashed.txt --manifest docs/license-evidence/wheel-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Wheel hash provenance failed' }
      - name: Download pinned build wheels and hash-lock full build closure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/license-evidence/build-wheelhouse | Out-Null
          python -m pip download --only-binary=:all: --dest docs/license-evidence/build-wheelhouse -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { throw 'Build wheel download failed' }
          python packaging/build_wheel_lock.py --wheelhouse docs/license-evidence/build-wheelhouse --out docs/license-evidence/build-hashed.txt --manifest docs/license-evidence/build-wheel-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Build wheel lock failed' }
      - name: Build
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - name: Install CI-only PDF verification tool
        run: python -m pip install 'pypdf==5.9.0'
      - name: Windows packaged PDF and backup validation
        shell: pwsh
        run: |
          python packaging/windows_ci_probe.py dist/LocalQuote-Desktop/LocalQuote-Desktop.exe docs/windows-ci-proof.json
      - name: Capture exact build package versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/license-evidence | Out-Null
          python -m pip freeze --all | Set-Content -Encoding utf8 docs/license-evidence/build-freeze.txt
      - name: Generate runtime SBOM and preview license notices
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
          python -m venv .audit-runtime
          .\.audit-runtime\Scripts\python.exe -m pip install --no-index --find-links docs/license-evidence/wheelhouse --require-hashes -r docs/license-evidence/runtime-hashed.txt
          if ($LASTEXITCODE -ne 0) { throw 'Audit runtime install failed' }
          python -m pip install cyclonedx-bom==7.5.0
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX tool install failed' }
          python -m cyclonedx_py environment --spec-version 1.6 --output-format JSON --output-file docs/license-evidence/runtime.cdx.json .audit-runtime/Scripts/python.exe
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX generation failed' }
          .\.audit-runtime\Scripts\python.exe packaging/license_audit.py --output docs/license-evidence --bundle dist/LocalQuote-Desktop
          if ($LASTEXITCODE -ne 0) { throw 'License audit gate failed' }
      - name: Compare native extensions against exact runtime wheel bytes
        shell: pwsh
        run: |
          python packaging/wheel_native_match.py --bundle dist/LocalQuote-Desktop --wheelhouse docs/license-evidence/wheelhouse --out docs/license-evidence/native-wheel-matches.json
          if ($LASTEXITCODE -ne 0) { throw 'Native wheel identity gate failed' }
      - name: Collect native DLL, Python/Tcl/Tk notices and hash-verified preview ZIP
        shell: pwsh
        run: |
          python packaging/native_provenance.py --bundle dist/LocalQuote-Desktop --python-home "$env:pythonLocation" --output docs/license-evidence --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Native evidence generation failed' }
          python -c "import json; p=json.load(open('docs/license-evidence/native-components.json',encoding='utf-8')); print('Release:',p['release_decision'],'Unresolved:',p['blocking_findings']); assert p['release_decision']=='HOLD'"
      - name: Independently verify packaged ZIP against published SHA-256 manifests
        shell: pwsh
        run: |
          python packaging/verify_preview.py --zip docs/license-evidence/LocalQuote-Windows-preview-integrity.zip --hash docs/license-evidence/archive-sha256.txt --manifest docs/license-evidence/package-file-hashes.json
          if ($LASTEXITCODE -ne 0) { throw 'Preview hash verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalQuote-P0-04-SBOM-License-Evidence
          path: docs/license-evidence/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: LocalQuote-Windows-CI-Evidence
          path: docs/windows-ci-proof.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: LocalQuote-Desktop-Windows-preview
          path: dist/LocalQuote-Desktop/
          retention-days: 7

  independent-rebuild:
    name: Independent Windows rebuild comparison (not a release)
    runs-on: windows-latest
    needs: windows-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download first-build evidence from independent job
        uses: actions/download-artifact@v4
        with:
          name: LocalQuote-P0-04-SBOM-License-Evidence
          path: first-evidence
      - name: Rebuild from same source commit on second Windows runner
        shell: pwsh
        run: |
          # Independent build, identical verified wheel bytes from first job.
          New-Item -ItemType Directory -Force docs/license-evidence | Out-Null
          Copy-Item -Recurse first-evidence/wheelhouse docs/license-evidence/wheelhouse
          Copy-Item -Recurse first-evidence/build-wheelhouse docs/license-evidence/build-wheelhouse
          Copy-Item first-evidence/runtime-hashed.txt docs/license-evidence/runtime-hashed.txt
          Copy-Item first-evidence/build-hashed.txt docs/license-evidence/build-hashed.txt
          python packaging/wheel_provenance.py --wheelhouse docs/license-evidence/wheelhouse --lock requirements-runtime.lock --out docs/license-evidence/runtime-reverified.txt --manifest docs/license-evidence/wheel-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Runtime re-verification failed' }
          if ((Get-Content -Raw docs/license-evidence/runtime-reverified.txt) -ne (Get-Content -Raw docs/license-evidence/runtime-hashed.txt)) { throw 'Runtime wheel bytes differ from first build' }
          python packaging/build_wheel_lock.py --wheelhouse docs/license-evidence/build-wheelhouse --out docs/license-evidence/build-reverified.txt --manifest docs/license-evidence/build-wheel-provenance.json
          if ($LASTEXITCODE -ne 0) { throw 'Build re-verification failed' }
          if ((Get-Content -Raw docs/license-evidence/build-reverified.txt) -ne (Get-Content -Raw docs/license-evidence/build-hashed.txt)) { throw 'Build wheel bytes differ from first build' }
          .\packaging\build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Second Windows build failed' }
      - name: Inventory second build and compare full file hashes
        shell: pwsh
        run: |
          python -m venv .audit-runtime
          .\.audit-runtime\Scripts\python.exe -m pip install --no-index --find-links docs/license-evidence/wheelhouse --require-hashes -r docs/license-evidence/runtime-hashed.txt
          if ($LASTEXITCODE -ne 0) { throw 'Second runtime license environment failed' }
          .\.audit-runtime\Scripts\python.exe packaging/license_audit.py --output second-evidence --bundle dist/LocalQuote-Desktop
          if ($LASTEXITCODE -ne 0) { throw 'Second license notice staging failed' }
          python packaging/wheel_native_match.py --bundle dist/LocalQuote-Desktop --wheelhouse docs/license-evidence/wheelhouse --out second-evidence/native-wheel-matches.json
          if ($LASTEXITCODE -ne 0) { throw 'Second mypyc wheel identity failed' }
          python packaging/native_provenance.py --bundle dist/LocalQuote-Desktop --python-home "$env:pythonLocation" --output second-evidence --commit "$env:GITHUB_SHA" --wheel-match second-evidence/native-wheel-matches.json
          if ($LASTEXITCODE -ne 0) { throw 'Second native inventory failed' }
          python packaging/compare_builds.py --first first-evidence/package-file-hashes.json --second second-evidence/package-file-hashes.json --out second-evidence/build-comparison.json
          if ($LASTEXITCODE -ne 0) { throw 'Non-reproducible Windows build: manifest differences found' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalQuote-P0-04-Independent-Rebuild
          path: |
            second-evidence/build-comparison.json
            second-evidence/package-file-hashes.json
          retention-days: 30
